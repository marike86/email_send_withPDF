name: Native WinUI build and offline tests
on: [push, pull_request]
jobs:
  legacy-cli:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v test_send_email
  core-tests:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test native/PdfMailer.Tests/PdfMailer.Tests.csproj -c Release --nologo
  winui-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Publish and run native UI smoke
        shell: pwsh
        run: ./scripts/build-native.ps1 -SkipTests -SmokeTest
      - uses: actions/upload-artifact@v4
        with:
          name: PdfMailer-win-x64
          path: artifacts/win-x64/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WinUI-native-smoke
          path: artifacts/smoke-*/
